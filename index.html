<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الصيانة والتشغيل</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="version-badge" style="position:fixed; bottom:6px; left:6px; z-index:99999; background:#101A2E; color:#fff; font-family:monospace; font-size:11px; padding:3px 8px; border-radius:6px; opacity:0.85;">v2026-08-04-B</div>
    <script>
      (function () {
        function showFallback(title, detail) {
          var root = document.getElementById("root");
          if (!root || root.firstChild) return; // لو React اشتغل بالفعل، سيبه
          root.innerHTML =
            '<div dir="rtl" style="font-family: Tahoma, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F4EE; padding: 24px; box-sizing: border-box;">' +
            '<div style="max-width: 640px; width: 100%; background: #FFFFFF; border: 1px solid #E3DDCE; border-right: 4px solid #AC4238; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px -10px rgba(16,26,46,0.2);">' +
            '<div style="font-weight: 800; font-size: 18px; color: #181F2E; margin-bottom: 8px;">الموقع مش عارف يفتح</div>' +
            '<div style="font-size: 13px; color: #5B6579; margin-bottom: 16px; line-height: 1.7;">صوّر الصفحة دي كاملة وابعتها في الشات.</div>' +
            '<div style="background: #FAEAE8; border: 1px solid #f0c9c4; border-radius: 10px; padding: 14px; font-size: 13px; color: #AC4238; font-weight: 700; margin-bottom: 10px; word-break: break-word;">' + title + '</div>' +
            '<pre style="background: #F6F4EE; border: 1px solid #E3DDCE; border-radius: 10px; padding: 14px; font-size: 11px; color: #181F2E; white-space: pre-wrap; word-break: break-word; direction: ltr; text-align: left; max-height: 320px; overflow: auto; margin: 0;">' + detail + '</pre>' +
            '</div></div>';
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              showFallback(
                "فشل تحميل ملف أساسي من الموقع (Script/Link Load Error)",
                "src: " + (target.src || target.href || "غير معروف") + "\n\nده معناه إن المتصفح مقدرش يجيب أحد ملفات الموقع، غالبًا بسبب مشكلة نشر (deploy) أو كاش قديم."
              );
            } else {
              showFallback(
                String((event.error && event.error.message) || event.message || "خطأ غير معروف"),
                String((event.error && event.error.stack) || (event.filename ? event.filename + ":" + event.lineno + ":" + event.colno : ""))
              );
            }
          },
          true
        );
        setTimeout(function () {
          showFallback(
            "الموقع فضل فاضي بعد 6 ثواني من التحميل",
            "معناه إن ملفات الموقع الأساسية مش وصلت للمتصفح خالص (مش حتى مشكلة في الكود نفسه). جرّب تتأكد إن آخر Deployment على Vercel فعلاً Ready، وجرّب تفتح الرابط في نافذة تصفح خاصة (Private/Incognito)."
          );
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
